[package]
name = "dictation"
version = "2.2.0"
edition = "2021"
description = "Push-to-talk dictation for Windows (Rust rewrite)"
license = "MIT"
publish = false

[dependencies]
# The code shared with the Linux app (SPEC.md)
dictation-core = { path = "../core" }
# Audio, Deepgram and TLS come through core (its Cargo.toml has the
# native-tls and schannel pins).

[build-dependencies]
embed-resource = "3"
png = "0.17"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
